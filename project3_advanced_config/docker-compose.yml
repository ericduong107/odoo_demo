version: '3.8'

services:
  db_advanced:
    image: postgres:15
    container_name: odoo_advanced_config_db
    environment:
      POSTGRES_DB: odoo_advanced
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db_data_advanced:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  odoo_advanced:
    image: odoo:17
    container_name: odoo_advanced_config
    depends_on:
      - db_advanced
    environment:
      HOST: db_advanced
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8071:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo

volumes:
  db_data_advanced:
