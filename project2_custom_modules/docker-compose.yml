version: '3.8'

services:
  db_custom:
    image: postgres:15
    container_name: odoo_custom_modules_db
    environment:
      POSTGRES_DB: odoo_custom_modules
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db_data_custom:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo_custom:
    image: odoo:17
    container_name: odoo_custom_modules
    depends_on:
      db_custom:
        condition: service_healthy
    environment:
      HOST: db_custom
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8070:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
    command: -c /etc/odoo/odoo.conf

volumes:
  db_data_custom:
